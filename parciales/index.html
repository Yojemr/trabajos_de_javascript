<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parcial Gimnasio</title>
  </head>
  <body>
    <section>
      <h1>Parcial 1</h1>
      <p>
        Un Gimnasio requiere realizar una aplicación en JavaScript para evaluar
        las condiciones iniciales de los clientes que ingresan por primera vez y
        así determinar cómo se encuentra cada uno y qué rutina de ejercicio debe
        tomar.
      </p>

      <div id="punto1">
        <p id="mensaje"></p>
        <h3 id="menu"></h3>
        <br />
        <label for="opcion">¿Qué desea hacer?<br /></label>
        <input type="number" id="opcion" name="opcion" min="1" max="6" />
        <button onclick="menu()">Seleccionar opción</button>
        <br />
        <div id="resultado_seleccion"></div>
        <p id="resultado_plan"></p>
        <br />
        <p id="resultado_cliente"></p>
        <p id="resultado_cliente_final"></p>
        <p id="opcionPago"></p>
        <p id="volver"></p>
      </div>
    </section>
    <script src="parcial_1.js"></script>
  </body>
</html>
