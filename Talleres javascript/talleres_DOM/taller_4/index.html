<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de tareas pendientes</title>

  <!-- Enlaces de estilos indicados en el taller -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Archivos propios del proyecto -->
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="imagenes/favicon.png">
</head>
<body>
  <!-- Contenedor principal de la lista de tareas -->
  <main class="contenedor">
    <h1>Listas de Tareas</h1>

    <!-- Datos para crear una tarea nueva -->
    <input id="ingresar-tarea" type="text" placeholder="Ingrese una tarea">
    <button id="boton-crear" type="button">Crear Tarea</button>

    <!-- JavaScript agregará aquí cada tarea -->
    <div id="lista-de-tareas"></div>
  </main>

  <!-- Menú explicativo, similar al de los talleres anteriores -->
  <details class="controles">
    <summary>Opciones del proyecto</summary>

    <div class="botones-controles">
      <button id="opcionEstructura" type="button">Estructura: puntos 1 al 9</button>
      <button id="opcionEstilos" type="button">Estilos: puntos 10 al 12</button>
      <button id="opcionBootstrap" type="button">Bootstrap: punto 13</button>
      <button id="opcionElementos" type="button">Elementos del DOM: punto 14</button>
      <button id="opcionCrear" type="button">Probar creación con clic</button>
      <button id="opcionEnter" type="button">Probar creación con Enter</button>
      <button id="opcionCompletar" type="button">Completar primera tarea</button>
      <button id="opcionEliminar" type="button">Eliminar última tarea</button>
      <button id="opcionRestablecer" type="button">Restablecer lista</button>
    </div>

    <p id="resultadoAccion">Selecciona una opción para leer qué hace y ver su resultado.</p>
  </details>

  <!-- Scripts indicados en el taller -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
