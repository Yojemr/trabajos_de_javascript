<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Licorera - Taller 2</title>

    <!-- Archivos externos del proyecto -->
    <link rel="icon" type="image/svg+xml" href="imagenes/favicon.svg">
    <link rel="stylesheet" href="Estilos.css">
</head>
<body>
    <!-- Contenedor principal de la licorera -->
    <div id="contenedor">
        <h1 id="titulo">🍸<br>Licores de Marca</h1>

        <!-- Lista que se consulta mediante sus identificadores -->
        <ul id="listaLicores">
            <li class="lista fondo-marron" id="oldpar">OldParr</li>
            <li class="lista fondo-naranja">Ginebra</li>
            <li class="lista fondo-marron" id="Buchanans">Buchanans</li>
            <li class="lista fondo-naranja">Chivas</li>
        </ul>
    </div>

    <!-- Menú plegable con la explicación y respuesta de cada punto -->
    <details class="resultados-dom">
        <summary>Resultados del DOM</summary>
        <div id="respuestas"></div>
    </details>

    <!-- Código de los ejercicios del DOM -->
    <script src="App.js"></script>
</body>
</html>
